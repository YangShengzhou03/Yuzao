[package]
name = "featurespec"
version = "0.1.0"
edition = "2021"
description = "FeatureSpec IR — 唯一写入 Creo 内核的输入（ADR-012）：类型定义、严格校验、错误码体系"
license = "MIT"

[lib]
name = "featurespec"
path = "src/lib.rs"

[[bin]]
name = "featurespec"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
